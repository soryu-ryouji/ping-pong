name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and Web export templates
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          godot_dir="$RUNNER_TEMP/godot"
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$godot_dir" "$templates_dir"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$godot_dir"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP/templates/templates/"* "$templates_dir/"
          chmod +x "$godot_dir/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Export Web build
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p build/web
          "$godot" --headless --path . --import
          "$godot" --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
